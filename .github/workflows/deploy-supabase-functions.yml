name: Deploy Supabase Edge Functions

# Auto-deploy Edge Functions เมื่อมีการแก้ไฟล์ใน supabase/functions แล้ว merge เข้า main
# ต้องตั้ง GitHub repo secret: SUPABASE_ACCESS_TOKEN (สร้างจาก supabase.com → Account → Access Tokens)

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
  workflow_dispatch: {}   # กดรันเองได้จากแท็บ Actions

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: fbwgmoorslblwmwftkfz
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy public functions (cron/LINE/บราวเซอร์เรียก — ปิด verify JWT)
        run: |
          for fn in attendance-report daily-summary notify-new-order notify-job-followup; do
            echo "::group::deploy $fn"
            supabase functions deploy "$fn" --project-ref "$PROJECT_REF" --no-verify-jwt
            echo "::endgroup::"
          done
